<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoodie Haven - Premium Hoodies</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background-color: #333; color: white; text-align: center; padding: 20px; }
        .products { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
        .product { background: white; margin: 10px; padding: 15px; width: 250px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
        .product img { width: 100%; height: 200px; object-fit: cover; }
        footer { background-color: #333; color: white; text-align: center; padding: 10px; position: fixed; width: 100%; bottom: 0; }
    </style>
</head>
<body>
    <header>
        <h1>Hoodie Haven</h1>
        <p>Your go-to for stylish, comfortable hoodies</p>
    </header>
    
    <section class="products">
        <div class="product">
            <img src="https://via.placeholder.com/250x200?text=Classic+Hoodie" alt="Classic Hoodie">
            <h3>Classic Hoodie</h3>
            <p>$39.99</p>
            <button>Add to Cart</button>
        </div>
        <div class="product">
            <img src="https://via.placeholder.com/250x200?text=Graphic+Hoodie" alt="Graphic Hoodie">
            <h3>Graphic Hoodie</h3>
            <p>$49.99</p>
            <button>Add to Cart</button>
        </div>
        <div class="product">
            <img src="https://via.placeholder.com/250x200?text=Zip-Up+Hoodie" alt="Zip-Up Hoodie">
            <h3>Zip-Up Hoodie</h3>
            <p>$44.99</p>
            <button>Add to Cart</button>
        </div>
    </section>
    
    <footer>
        <p>&copy; 2023 Hoodie Haven. Contact: info@hoodiehaven.com</p>
    </footer>
</body>
</html>
