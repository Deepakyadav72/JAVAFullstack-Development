<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function hello1(name, callBack){
          console.log ("Hello:"+name);
          callBack();
        }

        function hello2(){
            console.log("Hello.. it is a callBack function");
        }
        // hello1("deepak", hello2);

        setTimeout(()=>{
            hello1("Yadav", hello2);
        },4000)
    </script>
</body>
</html>
