<!DOCTYPE html>
<html lang="en">
<head>

 <title>Document</title>
</head>
<body>
 <h2>Item List</h2>

 <ul>
 <li id="item-1">Item 1 <button
onclick="hello(1);">Delete</button></li>
 <li id="item-2">Item 2 <button
onclick="hello(2);">Delete</button></li>
 <li id="item-3">Item 3 <button
onclick="hello(3);">Delete</button></li>
 </ul>
 <script>
 function hello(itemId){
 var result=confirm("Do you really want to delete this Item??");
 if(result){

 var listItem=document.getElementById("item-"+itemId);
 if(listItem){
 listItem.remove();
 }
 alert("Item deleted successfully");
 }
 else{
 alert("Deletion Cancelled...");
 }
 }
 </script>
</body>
