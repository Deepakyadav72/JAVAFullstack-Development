<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Pagination</title>
  <link rel="stylesheet" href="pagination2.css">
</head>
<body>
  <div class="pagination">
    <span class="page-label">PAGE 1 of 11</span>
    <button>&laquo;</button>
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button class="active">4</button>
    <button>5</button>
    <button>6</button>
    <span class="dots">...</span>
    <button>LAST &raquo;</button>
  </div>
</body>
</html>
